{% extends 'confessions/base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 p-4">
      <h2 class="text-center mb-4 fw-bold">Create an Account</h2>
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-dark w-100 py-2 mt-2">
          Sign Up
        </button>
      </form>
      <p class="text-center text-muted small mt-3">
        Already have an account?
        <a href="{% url 'login' %}" class="text-dark fw-bold">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
